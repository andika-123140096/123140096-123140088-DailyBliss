name: CI

on:
  push:
    branches: [ "main", "master", "develop", "project/123140096-123140088-DailyBliss" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'local.properties.example'
  pull_request:
    branches: [ "main", "master", "develop", "project/123140096-123140088-DailyBliss" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'local.properties.example'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Create local.properties (Dummy)
        run: echo "GEMINI_API_KEY=dummy_key_for_ci" > local.properties

      - name: Run Tests
        run: ./gradlew check --parallel --build-cache

  build-android:
    name: Build Android Debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Create local.properties (Dummy)
        run: echo "GEMINI_API_KEY=dummy_key_for_ci" > local.properties

      - name: Build Debug APK
        run: ./gradlew :composeApp:assembleDebug --parallel --build-cache

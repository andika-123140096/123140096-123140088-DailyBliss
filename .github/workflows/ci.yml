name: CI

on:
  push:
    branches: [ "main", "master", "develop", "project/123140096-123140088-DailyBliss" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'local.properties.example'
  pull_request:
    branches: [ "main", "master", "develop", "project/123140096-123140088-DailyBliss" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'local.properties.example'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Create local.properties (Dummy)
        run: echo "GEMINI_API_KEY=dummy_key_for_ci" > local.properties

      - name: Run Tests
        run: ./gradlew check --parallel --build-cache

  build-android:
    name: Build Android Debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Create local.properties (Dummy)
        run: echo "GEMINI_API_KEY=dummy_key_for_ci" > local.properties

      - name: Build Debug APK
        run: ./gradlew :composeApp:assembleDebug --parallel --build-cache

  ai-grading:
    name: AI Project Grader
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run AI Grader
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_NAME: ${{ secrets.GEMINI_MODEL_NAME }}
        run: node .github/scripts/ai_grader.js

      - name: Display AI Grading Results
        run: |
          if [ -f .github/penilaian-sementara.md ]; then
            echo "--- AI GRADING RESULTS ---"
            cat .github/penilaian-sementara.md
            echo "--- END OF RESULTS ---"
          else
            echo "No grading file generated."
          fi
